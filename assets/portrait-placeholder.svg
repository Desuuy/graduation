<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#F5EFE6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5D4A1"/>
      <stop offset="50%" stop-color="#C9A961"/>
      <stop offset="100%" stop-color="#B8954A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9A961" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#C9A961" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="750" fill="url(#bg)"/>

  <!-- Subtle radial glow behind monogram -->
  <circle cx="300" cy="370" r="240" fill="url(#glow)"/>

  <!-- Decorative corner ornaments -->
  <g stroke="url(#gold)" stroke-width="1.5" fill="none" opacity="0.55">
    <path d="M 40 40 L 100 40 M 40 40 L 40 100"/>
    <path d="M 560 40 L 500 40 M 560 40 L 560 100"/>
    <path d="M 40 710 L 100 710 M 40 710 L 40 650"/>
    <path d="M 560 710 L 500 710 M 560 710 L 560 650"/>
  </g>

  <!-- Inner thin frame -->
  <rect x="60" y="60" width="480" height="630" rx="6"
        fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.4"/>

  <!-- Outer monogram circle -->
  <circle cx="300" cy="370" r="120" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.7"/>
  <circle cx="300" cy="370" r="115" fill="none" stroke="url(#gold)" stroke-width="0.6" opacity="0.4"/>

  <!-- Monogram text NAH -->
  <text x="300" y="395" text-anchor="middle"
        font-family="Georgia, 'Cormorant Garamond', serif"
        font-size="92" font-style="italic" font-weight="600"
        fill="#1a1a1a" letter-spacing="4">NAH</text>

  <!-- Subtitle below monogram -->
  <text x="300" y="530" text-anchor="middle"
        font-family="'Be Vietnam Pro', system-ui, sans-serif"
        font-size="14" letter-spacing="6" fill="#8B8680" font-weight="500">CLASS OF 2026</text>

  <!-- Small decorative divider -->
  <line x1="240" y1="555" x2="360" y2="555" stroke="url(#gold)" stroke-width="1"/>

  <text x="300" y="585" text-anchor="middle"
        font-family="Georgia, serif" font-style="italic"
        font-size="20" fill="#1a1a1a" font-weight="500">Nguyễn Anh Huy</text>

  <text x="300" y="615" text-anchor="middle"
        font-family="'Be Vietnam Pro', system-ui, sans-serif"
        font-size="11" letter-spacing="3" fill="#C9A961" font-weight="600">TÂN CỬ NHÂN</text>

  <!-- Tiny graduation cap icon at bottom -->
  <g transform="translate(300, 660)" fill="#1a1a1a" opacity="0.75">
    <path d="M -22 0 L 0 -10 L 22 0 L 0 10 Z"/>
    <rect x="-1" y="-1" width="2" height="14" fill="#1a1a1a"/>
    <line x1="3" y1="13" x2="3" y2="6" stroke="#C9A961" stroke-width="1.2"/>
    <circle cx="3" cy="6" r="1.5" fill="#C9A961"/>
  </g>
</svg>
